name: Deploy Portfolio to Alwaysdata

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # 1. Créer/Entrer dans le dossier
            mkdir -p www
            cd www
            
            # 2. Nettoyage radical pour le premier déploiement
            if [ ! -d ".git" ]; then
              echo "Nettoyage total (fichiers cachés inclus)..."
              find . -maxdepth 1 -not -path '`.' -delete
              git clone https://github.com/yeadonaye/portfolio.git .
            else
              echo "Mise à jour..."
              git config --global --add safe.directory $(pwd)
              git fetch origin main
              git reset --hard origin/main
            fi

            # 3. Installation et Build avec chemin Node forcé
            export PATH=$PATH:/usr/local/bin
            npm install
            npm run build

            # 4. Redémarrage (on essaye les deux chemins possibles)
            if [ -f "/usr/local/bin/alv-restart-site" ]; then
              /usr/local/bin/alv-restart-site
            else
              alv-restart-site
            fi
