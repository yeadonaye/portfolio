script: |
            # 1. Entrer dans le dossier (le créer s'il n'existe pas)
            mkdir -p www
            cd www
            
            # 2. Configurer Git pour éviter les erreurs de permissions
            git config --global --add safe.directory $(pwd)

            # 3. Initialiser le dépôt si nécessaire ou mettre à jour
            if [ ! -d ".git" ]; then
              echo "Nettoyage du dossier et clonage initial..."
              # On vide le dossier pour éviter l'erreur "not empty"
              rm -rf *
              git clone https://github.com/yeadonaye/portfolio.git .
            else
              echo "Mise à jour du code existant..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # 4. Charger l'environnement Node.js
            export PATH=$PATH:/usr/local/bin
            
            # 5. Installation et Build (Nuxt 3)
            npm install
            npm run build

            # 6. Redémarrage du site via le chemin absolu
            /usr/local/bin/alv-restart-site
