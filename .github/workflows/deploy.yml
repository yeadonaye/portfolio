name: Deploy Nuxt (Build on GitHub)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy to Alwaysdata via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ".output/,package.json"
          target: "www/"
          rm: true # Nettoie le dossier avant l'envoi

      - name: Restart Alwaysdata Site
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # On tente de trouver la commande automatiquement
            if command -v alv-restart-site >/dev/null 2>&1; then
              alv-restart-site
            else
              # Si la commande échoue, on tue le processus node. 
              # Alwaysdata le relancera automatiquement.
              pkill -u ${{ secrets.SSH_USER }} node || true
              echo "Processus node relancé par pkill"
            fi
