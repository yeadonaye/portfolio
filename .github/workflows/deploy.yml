name: Deploy Nuxt to Alwaysdata

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # 1. Se positionner dans le répertoire personnel
            cd $HOME
            
            # 2. Nettoyage et préparation du dossier www
            if [ ! -d "www/.git" ]; then
              echo "Nettoyage complet du dossier www..."
              rm -rf www
              mkdir -p www
              cd www
              git clone https://github.com/yeadonaye/portfolio.git .
            else
              cd www
              echo "Mise à jour du dépôt existant..."
              git config --global --add safe.directory $(pwd)
              git fetch origin main
              git reset --hard origin/main
            fi

            # 3. Configuration de l'environnement Node.js
            export PATH=$PATH:/usr/local/bin
            
            # 4. Installation des dépendances et Build Nuxt
            echo "Installation des dépendances..."
            npm install
            echo "Construction du projet (Build)..."
            npm run build

            # 5. Redémarrage du site (Méthode Alwaysdata)
            echo "Redémarrage du site..."
            /usr/bin/alv-restart-site || alv-restart-site || echo "Redémarrage manuel requis via le panel"
