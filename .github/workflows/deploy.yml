name: Deploy Portfolio to Alwaysdata

on:
  push:
    branches:
      - main # Changez en 'master' si c'est le nom de votre branche

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            # 1. Aller dans le dossier du site
            cd www/
            
            # 2. Initialiser ou mettre à jour le code
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git pull origin main
            fi

            # 3. Charger Node.js (spécifique à Alwaysdata)
            export PATH=$PATH:/usr/local/bin
            
            # 4. Installer les dépendances et builder le projet Nuxt
            npm install
            npm run build

            # 5. Redémarrer le site pour appliquer les changements
            alv-restart-site
